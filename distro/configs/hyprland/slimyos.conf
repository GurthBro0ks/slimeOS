# SlimyOS Hyprland Config Overlay
# Source from main config: source = ~/.config/hypr/slimyos.conf

# F12 = PANIC STOP (kills all agents instantly)
bind = , F12, exec, ~/.slimyos/bin/slimyos-panic

# SUPER+ALT+M = Mission Control
bind = SUPER ALT, M, exec, xdg-open http://localhost:3002

# ydotool virtual device (required for desktop room)
device:ydotoold virtual device {
    kb_layout = us
}

# Keep agent windows on workspace 9
windowrulev2 = workspace 9 silent, title:^(SlimyOS)
